name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project TikTokHDUploader.xcodeproj \
            -scheme TikTokHDUploader \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/TikTokHDUploader.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/TikTokHDUploader.xcarchive/Products/Applications/TikTokHDUploader.app Payload/
          zip -r TikTokHDUploader.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTokHDUploader-IPA
          path: TikTokHDUploader.ipa

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0
          name: "TikTok HD Uploader v1.0.0"
          body: "Tự động build file IPA từ GitHub Actions (Chuẩn Full Request HD không nén)."
          files: TikTokHDUploader.ipa
